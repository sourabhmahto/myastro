name: Deploy Dev & Production

on:
  push:
    branches:
      - dev   # Deploys to Dev
      - main  # Deploys to Production

jobs:
  build:
    name: Build Vue App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: app-dist
          path: dist/

  # --- AUTOMATIC DEV DEPLOYMENT ---
  deploy-dev:
    name: Deploy to Dev
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: dist/

      - name: Deploy to Azure Dev App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'omkareshwar-dev-app'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_DEV }}
          package: dist/

  # --- PRODUCTION DEPLOYMENT ---
  deploy-prod:
    name: Deploy to Production
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app-dist
          path: dist/

      - name: Deploy to Azure Production App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'my-astro'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_PROD }}
          package: dist/
