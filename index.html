  <!-- Favicon -->

        extend: {

  <style>
    body {

      background-image: radial-gradient(#E06D14 0.65px, transparent 0.65px), radial-gradient(#7A1C1C 0.65px, #FAF6EE 0.65px);

    .sacred-texture-bg {

    .font-divine {
      font-family: 'Rozha One', 'Cinzel', 'Noto Sans Devanagari', serif;
    }
    .glass-nav {
      background: rgba(250, 246, 238, 0.94);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      background: linear-gradient(135deg, #7A1C1C 0%, #B45309 50%, #E06D14 100%);

      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 3s linear infinite;
    }
    @keyframes shimmer {
      to { background-position: 200% center; }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
