<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="crimsonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="100%" stop-color="#7F1D1D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D97706" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Sacred Circle Halo -->
  <g transform="translate(10, 5)">
    <circle cx="35" cy="35" r="32" fill="url(#crimsonGradient)" stroke="url(#goldGradient)" stroke-width="2.5" filter="url(#glow)"/>
    <!-- Outer auspicious rays dots -->
    <circle cx="35" cy="6" r="1.5" fill="#FDE68A" />
    <circle cx="64" cy="35" r="1.5" fill="#FDE68A" />
    <circle cx="35" cy="64" r="1.5" fill="#FDE68A" />
    <circle cx="6" cy="35" r="1.5" fill="#FDE68A" />
    <circle cx="55" cy="15" r="1.5" fill="#FDE68A" />
    <circle cx="15" cy="55" r="1.5" fill="#FDE68A" />
    <circle cx="55" cy="55" r="1.5" fill="#FDE68A" />
    <circle cx="15" cy="15" r="1.5" fill="#FDE68A" />

    <!-- Stylized Om & Trishul Motif -->
    <!-- Trishul prongs -->
    <path d="M 35,14 L 35,50" stroke="#FDE68A" stroke-width="2" stroke-linecap="round" />
    <path d="M 35,12 L 31,18 L 39,18 Z" fill="#F59E0B" />
    <path d="M 27,24 C 27,32 35,32 35,32 C 35,32 43,32 43,24" fill="none" stroke="#FDE68A" stroke-width="2" stroke-linecap="round" />
    <!-- Sacred Om symbol glyph in gold -->
    <text x="35" y="44" font-family="'Noto Sans Devanagari', 'Cinzel', serif" font-size="26" font-weight="bold" fill="#FFF" text-anchor="middle">ॐ</text>

    <!-- Sacred Narmada Wave Ribbon below -->
    <path d="M 17,54 Q 26,49 35,54 T 53,54" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Typography Brand Header -->
  <g transform="translate(90, 16)">
    <!-- Hindi / Sanskrit Sanctum Title -->
    <text x="0" y="20" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="20" font-weight="800" fill="#7F1D1D" letter-spacing="1">
      OMKARESHWAR
    </text>
    <!-- Sacred Jyotirlinga Sub-title -->
    <text x="175" y="20" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="14" font-weight="600" fill="#D97706" letter-spacing="2">
      JYOTIRLINGA
    </text>
    <!-- Tagline & Divine Seva -->
    <text x="0" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#64748B" letter-spacing="1.8">
      DIVINE PILGRIMAGE &amp; VEDIC POOJA SEVA
    </text>
    <!-- Decorative underline -->
    <line x1="0" y1="46" x2="280" y2="46" stroke="#E2E8F0" stroke-width="1" />
    <circle cx="140" cy="46" r="2.5" fill="#D97706" />
  </g>
</svg>
